name: Pull Request

on:
  pull_request: {}

env:
  # sets DEV_TAG_SHA to the last commit hash of the PR source branch being merged into base
  DEV_TAG_SHA: ${{ github.event.pull_request.head.sha }}
  CGO_LDFLAGS_ALLOW: "-s|-w"

permissions:
  contents: "read"
  id-token: "write"

jobs:
  docker-amd64:
    name: "Docker Build (amd64)"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ARCH: amd64
    steps:
      - name: Configure SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MOOVBOT_SSHKEY }}

      - name: Configure git to use SSH key
        run: 'git config --global url."ssh://git@github.com/".insteadOf "https://github.com/"'

      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: "gcp_auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ vars.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${DEV_TAG_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          tags: us-docker.pkg.dev/moov-gar/infra/imgproxy:${{ steps.vars.outputs.SHORT_SHA }}-amd64
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-arm64v8:
    name: "Docker Build (arm64v8)"
    timeout-minutes: 30
    runs-on: [ubuntu-4core-arm]
    env:
      ARCH: arm64v8
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: "gcp_auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ vars.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${DEV_TAG_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          tags: us-docker.pkg.dev/moov-gar/infra/imgproxy:${{ steps.vars.outputs.SHORT_SHA }}-arm64v8
          platforms: linux/arm64
          push: true

  manifest:
    name: Docker Push (manifest)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs:
      - docker-amd64
      - docker-arm64v8
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - id: "gcp_auth"
        name: "Authenticate to Google Cloud"
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: ${{ vars.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcp_auth.outputs.access_token }}

      - name: Create and push manifest
        run: |
          SHORT_SHA="${DEV_TAG_SHA:0:7}"
          docker manifest create us-docker.pkg.dev/moov-gar/infra/imgproxy:${SHORT_SHA} \
            --amend us-docker.pkg.dev/moov-gar/infra/imgproxy:${SHORT_SHA}-amd64 \
            --amend us-docker.pkg.dev/moov-gar/infra/imgproxy:${SHORT_SHA}-arm64v8
          docker manifest push us-docker.pkg.dev/moov-gar/infra/imgproxy:${SHORT_SHA}
